name: Run ring-default-specific

# Manual smoke run of the bundled `examples/ring-default-specific` spec
# (lives inside THIS repo at examples/ring-default-specific/). The example
# is the proof that Pi Coding Agent can run end-to-end on GitHub Actions
# with a real experiment, not just `validate --dry`.
#
# Matrix: 1 prompt × 3 scenarios × 1 profile × 1 model × 1 repetition = 3 cells
# Model:  inclusionai/ring-2.6-1t:free on OpenRouter (free tier)
# Secret: OPENROUTER_API_KEY (required — OpenRouter still rate-limits free models).

on:
  workflow_dispatch:
    inputs:
      run_mode:
        description: 'Run mode'
        type: choice
        options: [full, single, dry]
        default: single
      facet_system_ref:
        description: 'Git ref of facet-eval/facet-system (the runtime) to check out'
        type: string
        default: 'main'
      artifact_mode:
        description: 'Artifact contents'
        type: choice
        options: [minimal, full]
        default: minimal

jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout this action repo (includes the bundled spec)
        uses: actions/checkout@v4

      - name: Checkout FACET runtime (provides `pnpm facet`)
        uses: actions/checkout@v4
        with:
          repository: facet-eval/facet-system
          ref: ${{ inputs.facet_system_ref }}
          path: _facet-runtime

      - name: Register custom Pi model (~/.pi/agent/models.json)
        # `inclusionai/ring-2.6-1t:free` is not in the Pi SDK's default
        # ModelRegistry. Pi looks up custom models from
        # ~/.pi/agent/models.json. Merge the spec-local declaration before
        # the run. (When FACET implements Tier 1 of the pi-custom-model-registry
        # audit, this step can be removed.)
        run: |
          mkdir -p "$HOME/.pi/agent"
          node -e "
          const fs = require('fs');
          const path = require('path');
          const globalPath = path.join(process.env.HOME, '.pi/agent/models.json');
          const localPath = 'examples/ring-default-specific/models.json';
          const global = fs.existsSync(globalPath)
            ? JSON.parse(fs.readFileSync(globalPath, 'utf8'))
            : { providers: {} };
          const local = JSON.parse(fs.readFileSync(localPath, 'utf8'));
          for (const [prov, decl] of Object.entries(local.providers)) {
            const bucket = (global.providers[prov] ??= { models: [] });
            for (const m of decl.models) {
              const i = bucket.models.findIndex(x => x.id === m.id);
              if (i >= 0) bucket.models[i] = m; else bucket.models.push(m);
            }
          }
          fs.writeFileSync(globalPath, JSON.stringify(global, null, 2) + '\n');
          console.log('  ✓ merged into ' + globalPath);
          "

      - name: Run ring-default-specific
        id: facet
        uses: ./facet
        with:
          command: run
          spec_path: examples/ring-default-specific
          facet_repo_path: _facet-runtime
          run_mode: ${{ inputs.run_mode }}
          artifact_mode: ${{ inputs.artifact_mode }}
          timeout_minutes: 45
          retention_days: 14
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

      - name: Summary
        if: always()
        run: |
          echo "### ring-default-specific" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Mode | ${{ inputs.run_mode }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| FACET ref | ${{ inputs.facet_system_ref }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Bundle | ${{ steps.facet.outputs.result_bundle_name || '(none)' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Runs | ${{ steps.facet.outputs.run_count || '(unknown)' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Artifact | ${{ steps.facet.outputs.artifact_name || '(not uploaded)' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Exit code | ${{ steps.facet.outputs.exit_code || 'n/a' }} |" >> "$GITHUB_STEP_SUMMARY"
